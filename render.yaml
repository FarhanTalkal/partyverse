services:
  - type: web
    name: partyverse-server
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm install && npm run build -w @partyverse/shared && npm run build -w @partyverse/server
    startCommand: npm run start -w @partyverse/server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_ENABLED
        value: "false"
      - key: CORS_ORIGIN
        sync: false
